name: Quality Gate - VibeMusic API (uv)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  testes-automatizados:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v6

      - name: 2. Instalar e configurar o uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 3. Instalar dependências do projeto
        run: uv sync --locked

      - name: 4. Executar suíte de testes (Pytest)
        run: uv run pytest -v